# Trial: arm64 images for local development (Apple silicon) only. Pushes arch-suffixed tags to
# Docker Hub; does not touch :latest or the run-number tags, and does not announce a new image,
# so nothing here reaches the deploy repo or any cluster.

name: Build arm64 image

on:
  push:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # The Dockerfile cross-compiles on the host (CGO is off) and only copies the binary into an
      # alpine arm64 image, so no QEMU is needed. The default docker driver cannot build for
      # another platform without the containerd image store, hence a docker-container builder.
      - name: Build and push arm64 image
        run: |
          IMAGE=glintpay/glint-cloud-config-server
          docker buildx create --name arm64-builder --use
          docker buildx build --platform linux/arm64 \
            -t ${IMAGE}:latest-arm64 \
            -t ${IMAGE}:${{ github.run_number }}-arm64 \
            --push .
