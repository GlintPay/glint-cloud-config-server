name: Build & Docker publish

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Check out repo repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'  # or your version

      - name: Build and install covdata tool
        run: |
          TOOL=covdata
          TOOLDIR=$(go env GOROOT)/pkg/tool/linux_amd64
          go build -o /tmp/$TOOL cmd/$TOOL
          mkdir -p $TOOLDIR
          cp /tmp/$TOOL $TOOLDIR/$TOOL
          chmod +x $TOOLDIR/$TOOL
          file $TOOLDIR/$TOOL

      - name: Run tests
        run: make test-with-coverage

      - name: Build and upload image
        run: |
          make docker-build
          docker push glintpay/glint-cloud-config-server:latest
          docker tag glintpay/glint-cloud-config-server:latest glintpay/glint-cloud-config-server:${{ github.run_number }}
          docker push glintpay/glint-cloud-config-server:${{ github.run_number }}

      - name: Create deploy dispatch token
        id: deploy-dispatch-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GLINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLINT_APP_PRIVATE_KEY }}
          owner: GlintPay
          repositories: glint-cloud-config-server-deploy
          permission-contents: write

      - name: Announce new image
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          repository: GlintPay/glint-cloud-config-server-deploy
          token: ${{ steps.deploy-dispatch-token.outputs.token }}
          event-type: new-image
          client-payload: '{"run_number": "${{ github.run_number }}", "run_id": "${{ github.run_id }}", "sha": "${{ github.sha }}"}'

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
